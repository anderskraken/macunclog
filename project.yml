name: MacUnclog
options:
  bundleIdPrefix: io.github.anderskraken
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Configs/Signing.xcconfig
  Release: Configs/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: NO
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  MacUnclog:
    type: application
    platform: macOS
    sources:
      - path: MacUnclog
        excludes:
          - "Resources/LaunchAgents/**"
      - path: MacUnclog/Resources/LaunchAgents/io.github.anderskraken.macunclog.agent.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
      - path: skills/macunclog
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.anderskraken.macunclog
        PRODUCT_NAME: MacUnclog
        INFOPLIST_KEY_CFBundleDisplayName: MacUnclog
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Anders Kråkenes"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO
  MacUnclogTests:
    type: bundle.unit-test
    platform: macOS
    sources: [MacUnclogTests]
    dependencies:
      - target: MacUnclog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.anderskraken.macunclog.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MacUnclog.app/Contents/MacOS/MacUnclog"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  MacUnclog:
    build:
      targets:
        MacUnclog: all
        MacUnclogTests: [test]
    test:
      targets: [MacUnclogTests]
